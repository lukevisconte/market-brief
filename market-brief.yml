name: Trading day brief

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket or close"
        required: true
        default: "premarket"
  schedule:
    # Times are UTC. ET is UTC-4 during daylight saving (roughly Mar-Nov)
    # and UTC-5 the rest of the year — adjust by 1 hour twice a year,
    # or just leave it and accept the brief lands an hour off in winter.
    - cron: "30 11 * * 1-5"   # ~7:30am ET, Mon-Fri -> premarket
    - cron: "15 20 * * 1-5"   # ~4:15pm ET, Mon-Fri -> close

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run premarket brief
        if: github.event.schedule == '30 11 * * 1-5' || github.event.inputs.mode == 'premarket'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: python main.py premarket

      - name: Run close recap
        if: github.event.schedule == '15 20 * * 1-5' || github.event.inputs.mode == 'close'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: python main.py close
